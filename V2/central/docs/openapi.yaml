openapi: 3.1.0
info:
  title: AutoHome Central API
  version: 1.0.0
  description: >-
    Contrato HTTP inicial da Central. Esta definicao e a fonte canonica para
    geracao do cliente TypeScript da interface web.
servers:
  - url: /api/v1
    description: Central da instalacao local
tags:
  - name: Operacao
    description: Estado tecnico da central.
  - name: Autenticacao
    description: Sessao autenticada e credenciais do usuario.
  - name: Organizacao
    description: Organizacao administrativa da residencia em areas e comodos.
paths:
  /health:
    get:
      tags: [Operacao]
      operationId: getHealth
      summary: Consulta a disponibilidade tecnica da Central
      security: []
      responses:
        '200':
          description: API em execucao e dependencias essenciais disponiveis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthAvailable'
        '503':
          description: Uma dependencia essencial esta indisponivel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnavailable'
  /auth/login:
    post:
      tags: [Autenticacao]
      operationId: login
      summary: Inicia uma sessao autenticada
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessao criada. A resposta define o cookie de sessao HttpOnly.
          headers:
            Set-Cookie:
              description: Cookie assinado `autohome_session`, HttpOnly e SameSite=Lax.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
  /auth/logout:
    post:
      tags: [Autenticacao]
      operationId: logout
      summary: Encerra a sessao autenticada atual
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Sessao invalidada e cookie removido.
          headers:
            Set-Cookie:
              description: Instrucao para remover o cookie `autohome_session`.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/change-password:
    post:
      tags: [Autenticacao]
      operationId: changePassword
      summary: Altera a senha do usuario da sessao atual
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Senha alterada; a obrigatoriedade de troca e removida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
  /me:
    get:
      tags: [Autenticacao]
      operationId: getCurrentSession
      summary: Consulta a sessao e o usuario atual
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sessao autenticada atual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /areas:
    get:
      tags: [Organizacao]
      operationId: listAreas
      summary: Lista areas na ordem administrativa
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Areas ordenadas por posicao.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Organizacao]
      operationId: createArea
      summary: Cria uma area
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAreaRequest'
      responses:
        '201':
          description: Area criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /areas/{areaId}:
    patch:
      tags: [Organizacao]
      operationId: updateArea
      summary: Renomeia ou reordena uma area
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AreaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAreaRequest'
      responses:
        '200':
          description: Area atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AreaNotFound'
    delete:
      tags: [Organizacao]
      operationId: deleteArea
      summary: Exclui uma area sem comodos vinculados
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AreaId'
      responses:
        '204':
          description: Area excluida.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AreaNotFound'
        '409':
          $ref: '#/components/responses/AreaInUse'
  /rooms:
    get:
      tags: [Organizacao]
      operationId: listRooms
      summary: Lista comodos ordenados por area e posicao
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Comodos cadastrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Organizacao]
      operationId: createRoom
      summary: Cria um comodo com area opcional
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: Comodo criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AreaNotFound'
  /rooms/{roomId}:
    patch:
      tags: [Organizacao]
      operationId: updateRoom
      summary: Renomeia, reorganiza ou reordena um comodo
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
      responses:
        '200':
          description: Comodo atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Area ou comodo nao encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Organizacao]
      operationId: deleteRoom
      summary: Exclui um comodo sem modulos vinculados
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '204':
          description: Comodo excluido.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RoomNotFound'
        '409':
          $ref: '#/components/responses/RoomInUse'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: autohome_session
      description: Cookie de sessao assinado, enviado pelo navegador com credenciais.
  schemas:
    Area:
      type: object
      additionalProperties: false
      required: [id, name, position]
      properties:
        id:
          type: string
        name:
          type: string
        position:
          type: integer
          minimum: 0
    Room:
      type: object
      additionalProperties: false
      required: [id, name, position]
      properties:
        id:
          type: string
        name:
          type: string
        areaId:
          type: string
        position:
          type: integer
          minimum: 0
    CreateAreaRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        position:
          type: integer
          minimum: 0
    UpdateAreaRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        position:
          type: integer
          minimum: 0
    CreateRoomRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        areaId:
          type: string
        position:
          type: integer
          minimum: 0
    UpdateRoomRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        areaId:
          type: [string, 'null']
          description: Use null para remover o vinculo com a area.
        position:
          type: integer
          minimum: 0
    AreaResponse:
      type: object
      additionalProperties: false
      required: [area]
      properties:
        area:
          $ref: '#/components/schemas/Area'
    AreaListResponse:
      type: object
      additionalProperties: false
      required: [areas]
      properties:
        areas:
          type: array
          items:
            $ref: '#/components/schemas/Area'
    RoomResponse:
      type: object
      additionalProperties: false
      required: [room]
      properties:
        room:
          $ref: '#/components/schemas/Room'
    RoomListResponse:
      type: object
      additionalProperties: false
      required: [rooms]
      properties:
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/Room'
    HealthAvailable:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    HealthUnavailable:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: unavailable
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          format: password
          writeOnly: true
        newPassword:
          type: string
          minLength: 1
          format: password
          writeOnly: true
    SessionResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      additionalProperties: false
      required: [id, username, role, active, passwordChangeRequired]
      properties:
        id:
          type: string
          description: Identificador publico estavel; nunca o `_id` interno do MongoDB.
        username:
          type: string
        role:
          type: string
          enum: [basico, administrador]
        active:
          type: boolean
        passwordChangeRequired:
          type: boolean
    Error:
      type: object
      additionalProperties: false
      required: [code, message, details, requestId]
      properties:
        code:
          type: string
          description: Codigo estavel, legivel por maquina, do erro.
        message:
          type: string
          description: Mensagem segura para apresentacao ao usuario.
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
          description: Identificador para correlacao com os logs tecnicos.
  responses:
    Forbidden:
      description: A sessao autenticada nao tem permissao administrativa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AreaNotFound:
      description: A area informada nao existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RoomNotFound:
      description: O comodo informado nao existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AreaInUse:
      description: A area possui comodos vinculados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RoomInUse:
      description: O comodo possui modulos vinculados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Requisicao invalida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            requiredField:
              value:
                code: BAD_REQUEST
                message: A requisicao nao pode ser processada.
                details: {}
                requestId: req_123
    InvalidCredentials:
      description: Credenciais, senha atual ou sessao informada sao invalidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidCredentials:
              value:
                code: INVALID_CREDENTIALS
                message: Usuario ou senha invalidos.
                details: {}
                requestId: req_123
    Unauthenticated:
      description: A sessao autenticada e obrigatoria ou nao e mais valida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthenticated:
              value:
                code: UNAUTHENTICATED
                message: Autenticacao obrigatoria.
                details: {}
                requestId: req_123
  parameters:
    AreaId:
      name: areaId
      in: path
      required: true
      schema:
        type: string
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
