openapi: 3.1.0
info:
  title: AutoHome Central API
  version: 1.0.0
  description: >-
    Contrato HTTP inicial da Central. Esta definicao e a fonte canonica para
    geracao do cliente TypeScript da interface web.
servers:
  - url: /api/v1
    description: Central da instalacao local
tags:
  - name: Operacao
    description: Estado tecnico da central.
  - name: Autenticacao
    description: Sessao autenticada e credenciais do usuario.
  - name: Organizacao
    description: Organizacao administrativa da residencia em areas e comodos.
  - name: Modulos
    description: Descoberta administrativa e inventario de modulos adotados.
paths:
  /health:
    get:
      tags: [Operacao]
      operationId: getHealth
      summary: Consulta a disponibilidade tecnica da Central
      security: []
      responses:
        '200':
          description: API em execucao e dependencias essenciais disponiveis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthAvailable'
        '503':
          description: Uma dependencia essencial esta indisponivel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnavailable'
  /auth/login:
    post:
      tags: [Autenticacao]
      operationId: login
      summary: Inicia uma sessao autenticada
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessao criada. A resposta define o cookie de sessao HttpOnly.
          headers:
            Set-Cookie:
              description: Cookie assinado `autohome_session`, HttpOnly e SameSite=Lax.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
  /auth/logout:
    post:
      tags: [Autenticacao]
      operationId: logout
      summary: Encerra a sessao autenticada atual
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Sessao invalidada e cookie removido.
          headers:
            Set-Cookie:
              description: Instrucao para remover o cookie `autohome_session`.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/change-password:
    post:
      tags: [Autenticacao]
      operationId: changePassword
      summary: Altera a senha do usuario da sessao atual
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Senha alterada; a obrigatoriedade de troca e removida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
  /me:
    get:
      tags: [Autenticacao]
      operationId: getCurrentSession
      summary: Consulta a sessao e o usuario atual
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sessao autenticada atual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /areas:
    get:
      tags: [Organizacao]
      operationId: listAreas
      summary: Lista areas na ordem administrativa
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Areas ordenadas por posicao.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Organizacao]
      operationId: createArea
      summary: Cria uma area
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAreaRequest'
      responses:
        '201':
          description: Area criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /areas/{areaId}:
    patch:
      tags: [Organizacao]
      operationId: updateArea
      summary: Renomeia ou reordena uma area
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AreaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAreaRequest'
      responses:
        '200':
          description: Area atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AreaNotFound'
    delete:
      tags: [Organizacao]
      operationId: deleteArea
      summary: Exclui uma area sem comodos vinculados
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AreaId'
      responses:
        '204':
          description: Area excluida.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AreaNotFound'
        '409':
          $ref: '#/components/responses/AreaInUse'
  /rooms:
    get:
      tags: [Organizacao]
      operationId: listRooms
      summary: Lista comodos ordenados por area e posicao
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Comodos cadastrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Organizacao]
      operationId: createRoom
      summary: Cria um comodo com area opcional
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: Comodo criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AreaNotFound'
  /rooms/{roomId}:
    patch:
      tags: [Organizacao]
      operationId: updateRoom
      summary: Renomeia, reorganiza ou reordena um comodo
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
      responses:
        '200':
          description: Comodo atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Area ou comodo nao encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Organizacao]
      operationId: deleteRoom
      summary: Exclui um comodo sem modulos vinculados
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '204':
          description: Comodo excluido.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RoomNotFound'
        '409':
          $ref: '#/components/responses/RoomInUse'
  /discovery:
    get:
      tags: [Modulos]
      operationId: listDiscoveredModules
      summary: Lista modulos observados e ainda nao adotados
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProtocolIdFilter'
        - $ref: '#/components/parameters/ModuleFamilyFilter'
        - $ref: '#/components/parameters/ModuleCapabilityFilter'
        - $ref: '#/components/parameters/ModuleTransportFilter'
        - $ref: '#/components/parameters/ModuleAvailabilityFilter'
      responses:
        '200':
          description: Modulos no estado descoberto que atendem aos filtros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /discovery/{protocolId}/adopt:
    post:
      tags: [Modulos]
      operationId: adoptDiscoveredModule
      summary: Adota uma unica vez um modulo descoberto
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProtocolId'
      responses:
        '200':
          description: Modulo adotado, ainda sem organizacao de residencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DiscoveredModuleNotFound'
        '409':
          $ref: '#/components/responses/ModuleAlreadyAdopted'
  /modules:
    get:
      tags: [Modulos]
      operationId: listModules
      summary: Lista somente modulos adotados no inventario
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProtocolIdFilter'
        - $ref: '#/components/parameters/ModuleFamilyFilter'
        - $ref: '#/components/parameters/ModuleCapabilityFilter'
        - $ref: '#/components/parameters/ModuleTransportFilter'
        - $ref: '#/components/parameters/ModuleAvailabilityFilter'
      responses:
        '200':
          description: Modulos adotados que atendem aos filtros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /modules/{protocolId}:
    get:
      tags: [Modulos]
      operationId: getModuleDetail
      summary: Consulta o detalhe de um modulo adotado
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProtocolId'
      responses:
        '200':
          description: Inventario, organizacao, ultimo estado e sincronizacao persistida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ModuleNotFound'
    patch:
      tags: [Modulos]
      operationId: updateModuleOrganization
      summary: Nomeia ou vincula um modulo adotado a um comodo
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProtocolId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModuleOrganizationRequest'
      responses:
        '200':
          description: Organizacao administrativa atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Modulo adotado ou comodo nao encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /modules/{protocolId}/configurations:
    put:
      tags: [Modulos]
      operationId: setModuleConfiguration
      summary: Salva e sincroniza uma configuracao declarada do modulo
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProtocolId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModuleConfigurationRequest'
      responses:
        '200':
          description: Configuracao desejada, enviada e confirmada quando houver resposta valida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleConfigurationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ModuleNotFound'
        '422':
          $ref: '#/components/responses/ConfigurationInvalid'
  /modules/{protocolId}/local-links:
    post:
      tags: [Modulos]
      operationId: createModuleLocalLink
      summary: Cria um vinculo local entre capacidades compativeis
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProtocolId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocalLinkRequest'
      responses:
        '201':
          description: Vinculo persistido; so fica confirmado depois das confirmacoes dos participantes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ModuleNotFound'
        '422':
          $ref: '#/components/responses/LinkIncompatible'
  /commands:
    post:
      tags: [Modulos]
      operationId: createCommand
      summary: Solicita um comando operacional idempotente para um modulo adotado
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommandRequest'
      responses:
        '201':
          description: Comando criado e encaminhado ao transporte quando disponivel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '200':
          description: Repeticao idempotente; retorna o recurso criado na primeira solicitacao.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ModuleNotFound'
        '422':
          $ref: '#/components/responses/CommandInvalid'
  /commands/{commandId}:
    get:
      tags: [Modulos]
      operationId: getCommand
      summary: Consulta o estado publico persistido de um comando operacional
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CommandId'
      responses:
        '200':
          description: Comando encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CommandNotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: autohome_session
      description: Cookie de sessao assinado, enviado pelo navegador com credenciais.
  schemas:
    Area:
      type: object
      additionalProperties: false
      required: [id, name, position]
      properties:
        id:
          type: string
        name:
          type: string
        position:
          type: integer
          minimum: 0
    Room:
      type: object
      additionalProperties: false
      required: [id, name, position]
      properties:
        id:
          type: string
        name:
          type: string
        areaId:
          type: string
        position:
          type: integer
          minimum: 0
    CreateAreaRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        position:
          type: integer
          minimum: 0
    UpdateAreaRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        position:
          type: integer
          minimum: 0
    CreateRoomRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        areaId:
          type: string
        position:
          type: integer
          minimum: 0
    UpdateRoomRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        areaId:
          type: [string, 'null']
          description: Use null para remover o vinculo com a area.
        position:
          type: integer
          minimum: 0
    AreaResponse:
      type: object
      additionalProperties: false
      required: [area]
      properties:
        area:
          $ref: '#/components/schemas/Area'
    AreaListResponse:
      type: object
      additionalProperties: false
      required: [areas]
      properties:
        areas:
          type: array
          items:
            $ref: '#/components/schemas/Area'
    RoomResponse:
      type: object
      additionalProperties: false
      required: [room]
      properties:
        room:
          $ref: '#/components/schemas/Room'
    RoomListResponse:
      type: object
      additionalProperties: false
      required: [rooms]
      properties:
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/Room'
    Module:
      type: object
      additionalProperties: false
      required:
        [
          id,
          protocolId,
          family,
          capabilities,
          transport,
          status,
          availability,
          discoveredAt,
          lastSeenAt,
          lastObservedAt,
        ]
      properties:
        id:
          type: string
          description: Identificador publico estavel; nunca o `_id` interno do MongoDB.
        protocolId:
          type: string
          description: Identidade imutavel anunciada pelo protocolo do modulo.
        family:
          type: string
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/ModuleCapability'
        transport:
          type: string
          enum: [simulated]
        status:
          type: string
          enum: [descoberto, cadastrado]
        availability:
          type: string
          enum: [online, offline]
        discoveredAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        lastObservedAt:
          type: string
          format: date-time
        adoptedAt:
          type: string
          format: date-time
          description: Presente somente depois da adocao administrativa.
        name:
          type: string
          description: Nome administrativo opcional do modulo adotado.
        roomId:
          type: string
          description: Identificador publico do comodo opcionalmente vinculado.
    ModuleCapability:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
        configuration:
          type: array
          items:
            $ref: '#/components/schemas/ParameterDeclaration'
        events:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionDeclaration'
    ParameterDeclaration:
      type: object
      additionalProperties: false
      required: [key, type]
      properties:
        key:
          type: string
        type:
          type: string
          enum: [boolean, number, string]
        minimum:
          type: number
        maximum:
          type: number
        enum:
          type: array
          items:
            type: [boolean, number, string]
        required:
          type: boolean
    ActionDeclaration:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ParameterDeclaration'
    ModuleState:
      type: object
      additionalProperties: false
      required: [values, observedAt]
      properties:
        values:
          type: object
          additionalProperties: true
        firmwareHash:
          type: string
        observedAt:
          type: string
          format: date-time
    SynchronizationStatus:
      type: string
      enum: [pendente, confirmada, falhou]
    ModuleConfiguration:
      type: object
      additionalProperties: false
      required: [capabilityId, parameterKey, desired, syncStatus]
      properties:
        capabilityId:
          type: string
        parameterKey:
          type: string
        desired:
          type: [boolean, number, string]
        sent:
          $ref: '#/components/schemas/ConfigurationTransmission'
        confirmed:
          $ref: '#/components/schemas/ConfigurationConfirmation'
        syncStatus:
          $ref: '#/components/schemas/SynchronizationStatus'
        failureReason:
          type: string
          enum: [module_unavailable, transport_failed]
    ConfigurationTransmission:
      type: object
      additionalProperties: false
      required: [value, correlationId, sentAt]
      properties:
        value:
          type: [boolean, number, string]
        correlationId:
          type: string
        sentAt:
          type: string
          format: date-time
    ConfigurationConfirmation:
      type: object
      additionalProperties: false
      required: [value, confirmedAt]
      properties:
        value:
          type: [boolean, number, string]
        confirmedAt:
          type: string
          format: date-time
    LocalLink:
      type: object
      additionalProperties: false
      required: [id, source, target, syncStatus]
      properties:
        id:
          type: string
        source:
          $ref: '#/components/schemas/LocalLinkSource'
        target:
          $ref: '#/components/schemas/LocalLinkTarget'
        syncStatus:
          $ref: '#/components/schemas/SynchronizationStatus'
        failureReason:
          type: string
          enum: [module_unavailable, transport_failed]
    LocalLinkSource:
      type: object
      additionalProperties: false
      required: [capabilityId, event]
      properties:
        capabilityId:
          type: string
        event:
          type: string
    LocalLinkTarget:
      type: object
      additionalProperties: false
      required: [protocolId, capabilityId, action, parameters]
      properties:
        protocolId:
          type: string
        capabilityId:
          type: string
        action:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: [boolean, number, string]
    ModuleDetail:
      allOf:
        - $ref: '#/components/schemas/Module'
        - type: object
          additionalProperties: false
          required: [configurations, localLinks]
          properties:
            state:
              $ref: '#/components/schemas/ModuleState'
            configurations:
              type: array
              items:
                $ref: '#/components/schemas/ModuleConfiguration'
            localLinks:
              type: array
              items:
                $ref: '#/components/schemas/LocalLink'
    UpdateModuleOrganizationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        roomId:
          type: [string, 'null']
    SetModuleConfigurationRequest:
      type: object
      additionalProperties: false
      required: [capabilityId, parameterKey, value]
      properties:
        capabilityId:
          type: string
        parameterKey:
          type: string
        value:
          type: [boolean, number, string]
    CreateLocalLinkRequest:
      type: object
      additionalProperties: false
      required: [source, target]
      properties:
        source:
          $ref: '#/components/schemas/LocalLinkSource'
        target:
          $ref: '#/components/schemas/LocalLinkTarget'
    CreateCommandRequest:
      type: object
      additionalProperties: false
      required: [protocolId, capabilityId, action, parameters]
      properties:
        protocolId:
          type: string
          minLength: 1
        capabilityId:
          type: string
          minLength: 1
        action:
          type: string
          minLength: 1
        parameters:
          type: object
          additionalProperties:
            type: [boolean, number, string]
    Command:
      type: object
      additionalProperties: false
      required: [commandId, protocolId, capabilityId, action, parameters, status, createdAt]
      properties:
        commandId:
          type: string
          description: Identificador publico estavel do comando.
        protocolId:
          type: string
        capabilityId:
          type: string
        action:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: [boolean, number, string]
        status:
          type: string
          enum: [aguardando, enviado, confirmado, falhou, indisponivel]
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        failureReason:
          type: string
          enum: [transport_failed, module_unavailable]
    ModuleResponse:
      type: object
      additionalProperties: false
      required: [module]
      properties:
        module:
          $ref: '#/components/schemas/Module'
    ModuleDetailResponse:
      type: object
      additionalProperties: false
      required: [module]
      properties:
        module:
          $ref: '#/components/schemas/ModuleDetail'
    ModuleConfigurationResponse:
      type: object
      additionalProperties: false
      required: [configuration]
      properties:
        configuration:
          $ref: '#/components/schemas/ModuleConfiguration'
    LocalLinkResponse:
      type: object
      additionalProperties: false
      required: [localLink]
      properties:
        localLink:
          $ref: '#/components/schemas/LocalLink'
    ModuleListResponse:
      type: object
      additionalProperties: false
      required: [modules]
      properties:
        modules:
          type: array
          items:
            $ref: '#/components/schemas/Module'
    CommandResponse:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        command:
          $ref: '#/components/schemas/Command'
    HealthAvailable:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    HealthUnavailable:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: unavailable
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          format: password
          writeOnly: true
        newPassword:
          type: string
          minLength: 1
          format: password
          writeOnly: true
    SessionResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      additionalProperties: false
      required: [id, username, role, active, passwordChangeRequired]
      properties:
        id:
          type: string
          description: Identificador publico estavel; nunca o `_id` interno do MongoDB.
        username:
          type: string
        role:
          type: string
          enum: [basico, administrador]
        active:
          type: boolean
        passwordChangeRequired:
          type: boolean
    Error:
      type: object
      additionalProperties: false
      required: [code, message, details, requestId]
      properties:
        code:
          type: string
          description: Codigo estavel, legivel por maquina, do erro.
        message:
          type: string
          description: Mensagem segura para apresentacao ao usuario.
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
          description: Identificador para correlacao com os logs tecnicos.
  responses:
    Forbidden:
      description: A sessao autenticada nao tem permissao administrativa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AreaNotFound:
      description: A area informada nao existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RoomNotFound:
      description: O comodo informado nao existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AreaInUse:
      description: A area possui comodos vinculados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RoomInUse:
      description: O comodo possui modulos vinculados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DiscoveredModuleNotFound:
      description: O modulo informado nao foi descoberto pela Central.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ModuleAlreadyAdopted:
      description: O modulo informado ja foi adotado e nao pode ser adotado novamente.
      content:
        application/json:
              schema:
                $ref: '#/components/schemas/Error'
    ModuleNotFound:
      description: O modulo adotado informado nao existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConfigurationInvalid:
      description: Valor, tipo ou limite nao corresponde a declaracao anunciada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LinkIncompatible:
      description: A origem, destino, acao ou parametros do vinculo sao incompativeis.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CommandInvalid:
      description: A capacidade, acao ou parametros nao correspondem a declaracao do modulo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CommandNotFound:
      description: O comando informado nao existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Requisicao invalida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            requiredField:
              value:
                code: BAD_REQUEST
                message: A requisicao nao pode ser processada.
                details: {}
                requestId: req_123
    InvalidCredentials:
      description: Credenciais, senha atual ou sessao informada sao invalidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidCredentials:
              value:
                code: INVALID_CREDENTIALS
                message: Usuario ou senha invalidos.
                details: {}
                requestId: req_123
    Unauthenticated:
      description: A sessao autenticada e obrigatoria ou nao e mais valida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthenticated:
              value:
                code: UNAUTHENTICATED
                message: Autenticacao obrigatoria.
                details: {}
                requestId: req_123
  parameters:
    CommandId:
      name: commandId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    AreaId:
      name: areaId
      in: path
      required: true
      schema:
        type: string
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
    ProtocolId:
      name: protocolId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ProtocolIdFilter:
      name: protocolId
      in: query
      schema:
        type: string
        minLength: 1
    ModuleFamilyFilter:
      name: family
      in: query
      schema:
        type: string
        minLength: 1
    ModuleCapabilityFilter:
      name: capability
      in: query
      schema:
        type: string
        minLength: 1
    ModuleTransportFilter:
      name: transport
      in: query
      schema:
        type: string
        enum: [simulated]
    ModuleAvailabilityFilter:
      name: availability
      in: query
      schema:
        type: string
        enum: [online, offline]
