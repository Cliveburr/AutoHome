# Codex workspace policy
# Applies a non-interactive workspace-write policy when this configuration is loaded.
approval_policy = "never"
sandbox_mode = "danger-full-access"

[sandbox_workspace_write]
writable_roots = ["D:\\GitTemp\\makeframe"]

[windows]
sandbox = "elevated"   # Recommended
# sandbox = "unelevated" # Fallback if admin permissions/setup are unavailable

web_search = "cached"  # default; serves results from the web search cache
# web_search = "indexed" # gate external web access through the search index
# web_search = "live"  # fetch the most recent data from the web (same as --search)
# web_search = "disabled"

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]

[mcp_servers.kicad]
command = "uvx"
args = [
  "kicad-mcp-pro@3.29.1",
  "--transport",
  "streamable-http",
  "--port",
  "3334",
]

[mcp_servers.kicad.env]
"KICAD_MCP_PROJECT_DIR" = "D:\\Git\\AutoHome\\V2\\modules\\gen1\\hardware\\three_button_with_rele"
"KICAD_MCP_OPERATING_MODE" = "write"
"KICAD_MCP_PROFILE" = "full"

# This repository is a coding-only workspace. Keep the code navigation MCP;
# disable the browser-oriented runtime inherited from the user configuration.
[mcp_servers.node_repl]
enabled = false

# Keep only coding-adjacent plugins available in this project.
[plugins."documents@openai-primary-runtime"]
enabled = false

[plugins."pdf@openai-primary-runtime"]
enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."google-calendar@openai-curated"]
enabled = false

[plugins."slack@openai-curated"]
enabled = false

[plugins."sites@openai-bundled"]
enabled = false

# These bundled workflows are not part of normal implementation work.
